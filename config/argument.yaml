- id: CFR-47
  risk_id: RISK-47
  title: Article 47, effective remedy and fair trial
  protects: >-
    An effective remedy before a tribunal for everyone whose rights and freedoms under Union law are
    violated; a fair and public hearing within a reasonable time by an independent and impartial
    tribunal; legal aid where needed.
  echr: >-
    The first paragraph is based on Article 13 ECHR, with more extensive protection in Union law: the
    remedy is before a court. The second paragraph corresponds to Article 6(1) ECHR, but in Union law the
    right to a fair hearing is not confined to disputes relating to civil law rights and obligations.
  regime: Qualified, under Article 52(1).
  essence: >-
    Legislation giving no possibility of pursuing legal remedies to obtain access to, rectification
    or erasure of one's data does not respect the essence of Article 47 (Schrems I).
  interferences:
  - Decisions whose reasons cannot be given, so the person cannot challenge them.
  - Complaint channels that end inside the deployer, with no route to an independent body.
  - AI support in courts or administrative review that affects impartiality or equality of arms.
  questions:
  - Can the person learn the grounds of the decision in enough detail to contest it?
  - Is there a route to an independent body, and does the deployer's own procedure lead to it?
  - Does any confidentiality (security, trade secrets) limit the reasons given, and how is it compensated?
  sources:
  - Explanations, Article 47
  - FRA Charterpedia, Article 47
  - Schrems, C-362/14 (2015)
  - ZZ, C-300/11 (2013), disclosure of the essence of the grounds where State security is invoked; its reach beyond free movement is debated
  - Ligue des droits humains, C-817/19 (2022), self-learning systems too opaque to allow an effective remedy (paras 194–195)
  source_check: "Checked 18 November 2026 without access to EUR-Lex, CURIA or HUDOC. Explanations confirmed in structure (FRA reproduction); Schrems para. 95, ZZ and Ligue des droits humains paras. 194–195 confirmed in secondary sources."
