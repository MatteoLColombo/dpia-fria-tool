- id: CFR-35
  risk_id: RISK-35
  title: Article 35, health care
  protects: >-
    Access to preventive health care and to medical treatment under the conditions established by
    national laws and practices; a high level of human health protection in all Union policies.
  echr: >-
    None directly. According to the Explanations, the article is based on Article 168 TFEU (ex Article
    152 EC) and on Articles 11 and 13 of the European Social Charter; its second sentence takes over Article 168(1).
  regime: >-
    The first sentence grants access under national conditions; the second states a principle
    (Article 52(5)). Say which part is engaged.
  essence: Not defined in the case law.
  interferences:
  - Triage or prioritisation that delays or denies access to care.
  - Diagnostic or treatment support with different error rates across groups.
  - Eligibility decisions for reimbursement or coverage.
  - Health insurance pricing (an Article 27 use).
  questions:
  - Does the output change who receives care, or when?
  - Is clinical judgement free to depart from the output, and does it in practice?
  - Were performance and errors tested on the patient population actually served?
  sources:
  - Explanations, Article 35
  - FRA Charterpedia, Article 35
  - Regulation (EU) 2025/327 on the European Health Data Space
  - Case law on Article 35 in AI uses is thin
  source_check: "Checked 18 November 2026 without access to EUR-Lex, CURIA or HUDOC. Explanations confirmed (FRA reproduction); Regulation (EU) 2025/327 confirmed."
  status: DRAFT
